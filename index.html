<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاهد معي</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:420px;
text-align:center;
}

video{
width:100%;
border-radius:12px;
background:#000;
}

button{
margin-top:15px;
padding:14px 24px;
font-size:18px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>شاهد معي</h2>

<video id="video" autoplay playsinline></video>

<br>

<button onclick="startCamera()">تشغيل الكاميرا</button>

</div>

<script>
const stream = await navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: {
      exact: "environment"
    }
  },
  audio: false
});
document.getElementById("video").srcObject=stream;
}catch(e){
alert("تعذر تشغيل الكاميرا");
}
}
</script>

</body>
</html>
