<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاهد معي</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:95%;
    max-width:450px;
    text-align:center;
}

video{
    width:100%;
    border-radius:12px;
    background:black;
}

button{
    margin-top:15px;
    padding:14px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}
</style>

</head>

<body>

<div class="container">

<h2>شاهد معي</h2>

<video id="video" autoplay playsinline></video>

<button onclick="startCamera()">تشغيل الكاميرا</button>

</div>

<script>

const video = document.getElementById("video");

async function startCamera(){

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

    } catch(error) {

        alert("خطأ الكاميرا: " + error.message);

    }

}

</script>

</body>
</html>
