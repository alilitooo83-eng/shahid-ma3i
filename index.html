<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shahid Ma3i is a production-ready remote visual assistance app with WebRTC, Socket.io, and TURN support.">
  <title>شاهد معي | Shahid Ma3i</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" id="main-content">
    <header>
      <h1>🎥 شاهد معي</h1>
      <p class="subtitle">المساعدة المرئية عن بُعد</p>
    </header>

    <section class="video-container" aria-label="منطقة الفيديو">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="video" autoplay playsinline muted></video>
    </section>

    <section class="buttons" aria-label="أزرار التحكم">
      <button id="cameraBtn" type="button">📷 تشغيل الكاميرا</button>
      <button id="switchCameraBtn" type="button">🔄 تبديل الكاميرا</button>
      <button id="createRoomBtn" type="button">📤 إنشاء رابط الدعوة</button>
      <button id="joinBtn" type="button">✅ انضمام للجلسة</button>
      <button id="endRoomBtn" type="button">⛔ إنهاء الجلسة</button>
    </section>

    <section id="sessionArea" class="session-card" hidden>
      <div class="session-row">
        <h3>Room ID</h3>
        <div id="sessionCode" class="session-code">--------</div>
      </div>

      <div id="inviteArea" class="invite-card" hidden>
        <div class="invite-label">🔗 رابط الدعوة</div>
        <a id="inviteLink" class="invite-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="invite-actions">
          <button id="copyInviteBtn" class="success" type="button">نسخ الرابط</button>
          <button id="shareInviteBtn" class="secondary" type="button">📤 مشاركة الدعوة</button>
        </div>
      </div>
    </section>

    <section class="join">
      <input id="joinInput" type="text" maxlength="24" placeholder="أدخل Room ID أو افتح الرابط" autocomplete="off" inputmode="latin">
    </section>

    <div id="status" role="status" aria-live="polite">جاهز للعمل</div>
  </main>

  <script>
    window.__TURN_URL__ = window.__TURN_URL__ || "";
    window.__TURN_USERNAME__ = window.__TURN_USERNAME__ || "";
    window.__TURN_PASSWORD__ = window.__TURN_PASSWORD__ || "";
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
