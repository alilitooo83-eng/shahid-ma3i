<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شاهد معي | Shahid Ma3i</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎥 شاهد معي</h1>

    <p class="subtitle">
        المساعدة المرئية عن بُعد
    </p>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <div class="buttons">

        <button id="cameraBtn">
            📷 تشغيل الكاميرا
        </button>

        <button onclick="createRoom()">إنشاء جلسة</button>

    </div>

    <div id="sessionArea">

        <h3>رمز الجلسة</h3>

        <div id="sessionCode">
            ------
        </div>

    </div>

    <div class="join">

        <input
            id="joinInput"
            type="text"
            maxlength="6"
            placeholder="أدخل رمز الجلسة">

       <button onclick="joinRoom()">انضمام</button>

    </div>

    <div id="status">

        جاهز للعمل

    </div>

</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
